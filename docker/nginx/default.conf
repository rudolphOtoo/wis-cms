# Docker's embedded DNS re-resolves container names so a recreated
# "app" container (new IP) never leaves nginx pointing at a dead
# upstream (the classic 502 after `docker compose up -d app`).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # ── Response compression ─────────────────────────────────────
    # Vite output is already minified; gzip cuts the wire size by
    # another ~70-80% for JS/CSS/JSON/HTML. Off by default in the
    # stock nginx image.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xhtml+xml
        image/svg+xml
        application/vnd.ms-fontobject
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ── Versioned Vite build assets: hashed filenames are immutable ──
    location /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        set $fpm_upstream app:9000;
        fastcgi_pass $fpm_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
