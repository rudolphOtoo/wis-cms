services:
  postgres:
    image: postgres:16-alpine
    container_name: wis_cms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-wis_cms}
      POSTGRES_USER: ${DB_USERNAME:-wis_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - ${DIOCESE_PROFILE:-wis}_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-wis_admin} -d ${DB_DATABASE:-wis_cms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: wis-cms-app
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: wis_cms_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-wis_cms}
      DB_USERNAME: ${DB_USERNAME:-wis_admin}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      QUEUE_CONNECTION: database
      WIS_RUNTIME_DIR: /var/www/html/storage/docker-runtime
    volumes:
      # Shared by app, queue and scheduler. It carries BOTH the uploaded
      # files and the single persisted APP_KEY, so containers agree on the
      # encryption key across restarts. Previously storage lived in each
      # container's writable layer, so uploads and the key were both lost on
      # recreate, and each container generated a DIFFERENT key — which made
      # database sessions and at-rest ciphertext undecryptable.
      - ${DIOCESE_PROFILE:-wis}_app_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "php-fpm: master process"]
      interval: 10s
      timeout: 5s
      # Boot runs explicit migrations + the full roster CSV import before
      # php-fpm execs. queue and scheduler gate on this being healthy, so
      # allow a generous window or they never start after a rebuild.
      start_period: 300s
      retries: 5

  webserver:
    image: wis-cms-webserver
    build:
      context: .
      dockerfile: Dockerfile
      target: webserver
    container_name: wis_cms_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      app:
        condition: service_healthy

  queue:
    image: wis-cms-app
    container_name: wis_cms_queue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-wis_cms}
      DB_USERNAME: ${DB_USERNAME:-wis_admin}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      QUEUE_CONNECTION: database
      WIS_RUNTIME_DIR: /var/www/html/storage/docker-runtime
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ${DIOCESE_PROFILE:-wis}_app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    image: wis-cms-app
    container_name: wis_cms_scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-wis_cms}
      DB_USERNAME: ${DB_USERNAME:-wis_admin}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      QUEUE_CONNECTION: database
      WIS_RUNTIME_DIR: /var/www/html/storage/docker-runtime
    command: php artisan schedule:work
    volumes:
      - ${DIOCESE_PROFILE:-wis}_app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy

volumes:
  wis_app_storage:
  mcgh_app_storage:
  wis_postgres_data:
  mcgh_postgres_data:
