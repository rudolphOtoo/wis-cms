services:
  wis_cms_db:
    image: postgres:16-alpine
    container_name: wis_cms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-wis_cms}
      POSTGRES_USER: ${DB_USERNAME:-wis_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wis_password}
    ports:
      - "5433:5432"
    volumes:
      - ${DIOCESE_PROFILE:-wis}_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-wis_user} -d ${DB_DATABASE:-wis_cms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/rudolphotoo/wis-cms-app:${IMAGE_TAG:-latest}
    container_name: wis_cms_app
    restart: unless-stopped
    # Optional: a machine with no .env at all must still boot. The image ships
    # .env.example and docker/entrypoint.sh seeds .env from it, so omitting the
    # host file degrades to documented defaults instead of aborting the deploy.
    # The file, when present, still takes precedence.
    env_file:
      - path: .env
        required: false
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: wis_cms_db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-wis_cms}
      DB_USERNAME: ${DB_USERNAME:-wis_user}
      DB_PASSWORD: ${DB_PASSWORD:-wis_password}
      QUEUE_CONNECTION: database
      SESSION_SECURE_COOKIE: "false"
      WIS_RUNTIME_DIR: /var/www/html/storage/docker-runtime
    volumes:
      # Persists uploaded photos/logs/compiled views AND the shared APP_KEY
      # across recreates. Without this, uploads and the encryption key were
      # both lost every time the container was rebuilt.
      - ${DIOCESE_PROFILE:-wis}_app_storage:/var/www/html/storage
    depends_on:
      wis_cms_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      # First boot runs migrations + full roster import before php-fpm
      # execs; dependents must not time out during that window.
      start_period: 300s
      retries: 12

  webserver:
    image: ghcr.io/rudolphotoo/wis-cms-webserver:${IMAGE_TAG:-latest}
    container_name: wis_cms_webserver
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:80"
    depends_on:
      app:
        condition: service_healthy

  queue:
    image: ghcr.io/rudolphotoo/wis-cms-app:${IMAGE_TAG:-latest}
    container_name: wis_cms_queue
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: wis_cms_db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-wis_cms}
      DB_USERNAME: ${DB_USERNAME:-wis_user}
      DB_PASSWORD: ${DB_PASSWORD:-wis_password}
      QUEUE_CONNECTION: database
      SESSION_SECURE_COOKIE: "false"
      WIS_RUNTIME_DIR: /var/www/html/storage/docker-runtime
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    # Same volume as `app` so both read the identical APP_KEY. A separately
    # generated key would make session and at-rest ciphertext undecryptable.
    volumes:
      - ${DIOCESE_PROFILE:-wis}_app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    image: ghcr.io/rudolphotoo/wis-cms-app:${IMAGE_TAG:-latest}
    container_name: wis_cms_scheduler
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: wis_cms_db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-wis_cms}
      DB_USERNAME: ${DB_USERNAME:-wis_user}
      DB_PASSWORD: ${DB_PASSWORD:-wis_password}
      QUEUE_CONNECTION: database
      SESSION_SECURE_COOKIE: "false"
      WIS_RUNTIME_DIR: /var/www/html/storage/docker-runtime
    command: sh -c "while :; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ${DIOCESE_PROFILE:-wis}_app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy

volumes:
  wis_app_storage:
  mcgh_app_storage:
  wis_postgres_data:
  mcgh_postgres_data:
