services:
  postgres:
    image: postgres:16-alpine
    container_name: wis_cms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-wis_cms}
      POSTGRES_USER: ${DB_USERNAME:-wis_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wis_secret_2024}
    ports:
      - "5433:5432"
    volumes:
      - ${DIOCESE_PROFILE:-wis}_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-wis_admin} -d ${DB_DATABASE:-wis_cms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/rudolphotoo/wis-cms-app:${IMAGE_TAG:-latest}
    container_name: wis_cms_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-wis_cms}
      DB_USERNAME: ${DB_USERNAME:-wis_admin}
      DB_PASSWORD: ${DB_PASSWORD:-wis_secret_2024}
      QUEUE_CONNECTION: database
      SESSION_SECURE_COOKIE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "php-fpm: master process"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 5

  webserver:
    image: ghcr.io/rudolphotoo/wis-cms-webserver:${IMAGE_TAG:-latest}
    container_name: wis_cms_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      app:
        condition: service_healthy

  queue:
    image: ghcr.io/rudolphotoo/wis-cms-app:${IMAGE_TAG:-latest}
    container_name: wis_cms_queue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-wis_cms}
      DB_USERNAME: ${DB_USERNAME:-wis_admin}
      DB_PASSWORD: ${DB_PASSWORD:-wis_secret_2024}
      QUEUE_CONNECTION: database
      SESSION_SECURE_COOKIE: "false"
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    image: ghcr.io/rudolphotoo/wis-cms-app:${IMAGE_TAG:-latest}
    container_name: wis_cms_scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-wis_cms}
      DB_USERNAME: ${DB_USERNAME:-wis_admin}
      DB_PASSWORD: ${DB_PASSWORD:-wis_secret_2024}
      QUEUE_CONNECTION: database
      SESSION_SECURE_COOKIE: "false"
    command: sh -c "while :; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on:
      app:
        condition: service_healthy

volumes:
  wis_postgres_data:
